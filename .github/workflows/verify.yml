name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  metadata-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_splat_config.py
      - run: git diff --exit-code config/us/splat.yaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
