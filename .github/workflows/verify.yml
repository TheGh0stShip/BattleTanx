name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  decomp-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_decomp_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: NBXE_report
          path: build/report.json
          if-no-files-found: error

  metadata-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_splat_config.py
      - run: git diff --exit-code config/us/splat.yaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
