[region]
name = "Asset identification"
rom_start = 0x101000
rom_end = 0x800000

# Every byte of the region is listed exactly once in the interval ledger, as
# payload, container, padding, unused or unknown.  Payload and container bytes
# are credited to the category of their contents; padding and unused bytes are
# classified but credited to no category.  The ledger is generated by
# tools/asset_inventory/rom_ledger.py from the per-format parsers.

[ledger]
path = "config/us/asset_ledger.tsv"
